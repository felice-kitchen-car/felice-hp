  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0C0C0C; --bg2: #141414; --bg3: #1C1C1C;
      --cream: #F5EFE0; --gold: #C9A84C;
      --white: #FAFAF7; --muted: rgba(255,255,255,0.45);
      --border: rgba(255,255,255,0.08);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Noto Sans JP', sans-serif; font-weight: 300; background: var(--bg); color: var(--white); overflow-x: hidden; }

    /* HEADER */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; padding: 0 48px; background: rgba(12,12,12,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
    .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 80px; }
    .logo-text { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; letter-spacing: 6px; color: var(--white); text-decoration: none; }
    nav { display: flex; gap: 28px; }
    nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; letter-spacing: .12em; transition: color .2s; }
    nav a:hover { color: var(--white); }
    .btn-header { border: 1px solid rgba(201,168,76,.6); color: #C9A84C; font-size: 12px; letter-spacing: .15em; padding: 10px 24px; text-decoration: none; transition: all .2s; }
    .btn-header:hover { background: rgba(201,168,76,.1); }
    @media(max-width:768px){ nav { display:none; } header { padding: 0 20px; } }

    /* MAIN */
    .page-wrap { max-width: 900px; margin: 0 auto; padding: 120px 24px 80px; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px,5vw,44px); font-weight: 400; letter-spacing: .1em; color: var(--white); margin-bottom: 8px; }
    .page-sub { font-size: 12px; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; margin-bottom: 48px; }

    /* 月ナビゲーション */
    .month-nav { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom: 36px; }
    .month-nav button {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(201,168,76,.4);
      background: transparent; color: var(--gold); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
      font-family: inherit;
    }
    .month-nav button:hover { background: rgba(201,168,76,.12); }
    .month-nav button:disabled { opacity: .3; cursor: default; }
    .month-nav button:disabled:hover { background: transparent; }
    .month-nav .month-label {
      font-family: 'Cormorant Garamond', serif; font-size: 24px; letter-spacing: .12em;
      color: var(--white); min-width: 160px; text-align: center; margin: 0; border: none; padding: 0;
    }

    /* 月区切り */
    .month-block { margin-bottom: 48px; }
    .empty-month { text-align:center; color:var(--muted); padding: 50px 0; font-size:14px; }

    /* 本日の出店 */
    .event-row.today {
      background: rgba(201,168,76,.08);
      border-left: 3px solid var(--gold);
      border-bottom-color: rgba(201,168,76,.25);
      padding-left: 13px; margin-left: -16px; padding-right: 16px;
    }
    .today-badge {
      display: inline-block; font-size: 10px; letter-spacing: .1em; font-weight: 600;
      color: var(--bg); background: var(--gold); border-radius: 3px;
      padding: 2px 7px; margin-left: 10px; vertical-align: middle;
    }

    /* イベント行 */
    .event-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
      align-items: center;
    }
    .event-row:hover { background: rgba(255,255,255,.02); }
    .ev-date { display:flex; flex-direction:column; }
    .ev-date .day { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--white); line-height: 1; }
    .ev-date .wd  { font-size: 11px; margin-top: 2px; }
    .ev-date .wd.sun { color: #e06060; }
    .ev-date .wd.sat { color: #6090c8; }
    .ev-date .wd.wkd { color: var(--muted); }
    .ev-info { padding: 0 16px; }
    .ev-name { font-size: 15px; color: var(--white); margin-bottom: 4px; line-height: 1.4; }
    .ev-loc  { font-size: 12px; color: var(--cream); }
    .ev-time { font-size: 12px; color: rgba(201,168,76,.8); white-space: nowrap; text-align: right; }

    /* ローディング・空 */
    .loading { text-align:center; color:var(--muted); padding: 60px 0; font-size:14px; }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 32px 24px; text-align: center; }
    footer p { font-size: 11px; color: var(--muted); letter-spacing: .1em; }

    @media(max-width:600px){
      .event-row { grid-template-columns: 72px 1fr; }
      .ev-time { display:none; }
      .ev-date .day { font-size: 26px; }
    }
  </style>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo-text">Felice</a>
    <nav>
      <a href="index.html#menu">メニュー</a>
      <a href="index.html#about">FELICEについて</a>
      <a href="shutten.html">出店依頼</a>
    </nav>
    <a href="shutten.html" class="btn-header">出店依頼</a>
  </div>
</header>

<div class="page-wrap">
  <p class="page-sub">Schedule</p>
  <h1 class="page-title">出店スケジュール</h1>

  <div class="month-nav">
    <button id="prevMonthBtn" aria-label="前の月">&#8249;</button>
    <p class="month-label" id="monthLabel">&nbsp;</p>
    <button id="nextMonthBtn" aria-label="次の月">&#8250;</button>
  </div>

  <div id="scheduleRoot"><p class="loading">読み込み中...</p></div>
</div>

<footer>
  <p style="margin-bottom:10px;"><a href="houjin.html" style="color:var(--muted); text-decoration:underline;">法人のお客様へ</a></p>
  <p>© FELICE KITCHEN CAR</p>
</footer>

<script>
(function(){
  var DATA_URL = 'https://pizza-order-bx2.pages.dev/api/calendar';
  var WD  = ['日','月','火','水','木','金','土'];
  var MON_JA = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function pad(n){ return ('0'+n).slice(-2); }

  var today = new Date(); today.setHours(0,0,0,0);
  var todayStr = today.getFullYear() + '-' + pad(today.getMonth()+1) + '-' + pad(today.getDate());
  var cy = today.getFullYear(), cm = today.getMonth(); // 表示中の年月（今月から開始）
  var allEvents = []; // 取得した全予定（過去・未来とも）
  var loaded = false;

  var prevBtn = document.getElementById('prevMonthBtn');
  var nextBtn = document.getElementById('nextMonthBtn');
  var monthLabelEl = document.getElementById('monthLabel');
  var rootEl = document.getElementById('scheduleRoot');

  function render(){
    monthLabelEl.textContent = cy + '年 ' + MON_JA[cm];

    if (!loaded) {
      rootEl.innerHTML = '<p class="loading">読み込み中...</p>';
      return;
    }

    var prefix = cy + '-' + pad(cm + 1);
    var monthEvents = allEvents
      .filter(function(ev){ return ev.date.indexOf(prefix) === 0; })
      .sort(function(a,b){ return a.date < b.date ? -1 : 1; });

    if (monthEvents.length === 0) {
      rootEl.innerHTML = '<p class="empty-month">この月の出店予定はありません</p>';
      return;
    }

    var html = '<div class="month-block">';
    monthEvents.forEach(function(ev){
      var d   = new Date(ev.date + 'T00:00:00');
      var day = d.getDate();
      var wd  = d.getDay();
      var wdLabel = WD[wd];
      var wdClass = wd === 0 ? 'sun' : wd === 6 ? 'sat' : 'wkd';
      var isToday = ev.date === todayStr;
      html += '<div class="event-row' + (isToday ? ' today' : '') + '">';
      html += '<div class="ev-date">'
            + '<span class="day">' + pad(day) + '</span>'
            + '<span class="wd ' + wdClass + '">(' + wdLabel + ')</span>'
            + '</div>';
      html += '<div class="ev-info">'
            + '<p class="ev-name">' + escHtml(ev.name) + (isToday ? '<span class="today-badge">TODAY</span>' : '') + '</p>'
            + (ev.location ? '<p class="ev-loc">&#128205; <a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ev.location) + '" target="_blank" style="color:inherit;text-decoration:underline;text-underline-offset:3px;">' + escHtml(ev.location) + '</a></p>' : '')
            + '</div>';
      html += '<div class="ev-time">' + escHtml(ev.time) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    rootEl.innerHTML = html;
  }

  function changeMonth(dir){
    cm += dir;
    if (cm > 11) { cm = 0; cy++; }
    if (cm < 0)  { cm = 11; cy--; }
    render();
  }

  prevBtn.addEventListener('click', function(){ changeMonth(-1); });
  nextBtn.addEventListener('click', function(){ changeMonth(1); });

  render(); // 読み込み中表示をすぐ出す

  fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(data){
      allEvents = (data.events || []).map(function(e){
        var timeStr = e.timeStart ? (e.timeStart + '〜' + (e.timeEnd || e.timeStart)) : '';
        return { date: e.date, name: e.loc, location: e.loc, time: timeStr };
      });
      loaded = true;
      render();

      // 検索エンジン向け：今後の出店予定をイベント構造化データとして埋め込む
      // ※場所が入っている・今日以降の予定だけを対象にする（過去や場所なしはGoogleでエラーになるため）
      try {
        var ldEvents = allEvents
          .filter(function(ev){ return ev.location && ev.date >= todayStr; })
          .map(function(ev){
            var ld = {
              "@context": "https://schema.org",
              "@type": "Event",
              "name": "FELICE キッチンカー出店：" + ev.name,
              "startDate": ev.date,
              "eventStatus": "https://schema.org/EventScheduled",
              "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
              "image": "https://felice-foodtruck.com/images/pizza-margherita.jpg",
              "description": "本格石窯ナポリピザのキッチンカー FELICE が「" + ev.name + "」に出店します。",
              "organizer": {
                "@type": "Organization",
                "name": "FELICE キッチンカー石窯ピッツァ",
                "url": "https://felice-foodtruck.com"
              }
            };
            if (ev.time) {
              var t = ev.time.split('〜');
              if (t[0]) ld.startDate = ev.date + 'T' + t[0] + ':00+09:00';
              if (t[1]) ld.endDate = ev.date + 'T' + t[1] + ':00+09:00';
            }
            ld.location = { "@type": "Place", "name": ev.location, "address": ev.location };
            return ld;
          });
        var ldTag = document.createElement('script');
        ldTag.type = 'application/ld+json';
        ldTag.text = JSON.stringify(ldEvents);
        document.head.appendChild(ldTag);
      } catch(e) {}
    })
    .catch(function(e){
      rootEl.innerHTML = '<p class="loading">スケジュールの取得に失敗しました。</p>';
    });
})();
</script>
</body>
</html>
